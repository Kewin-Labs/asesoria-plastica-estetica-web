server {
    listen 80;
    server_name asesoriaplasticayestetica.com www.asesoriaplasticayestetica.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name asesoriaplasticayestetica.com www.asesoriaplasticayestetica.com;

    ssl_certificate /etc/letsencrypt/live/asesoriaplasticayestetica.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/asesoriaplasticayestetica.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /var/www/asesoria/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
}
